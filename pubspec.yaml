name: comizy
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.12.0
  flutter_map: ^8.2.2
  provider: ^6.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  intl: ^0.20.2
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.2.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#0b4788"
  image: assets/images/logo_com_nome.png
  android: true
  ios: true

flutter_launcher_icons:
  image_path: "assets/images/logo_simples_azul.png"
  android: "launcher_icon"
  min_sdk_android: 16 # android min sdk min:16, default 21
  ios: true
  remove_alpha_ios: true
